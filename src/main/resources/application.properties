spring.application.name=seatmap-api

# Database. The password is not committed: set SEATMAP_DB_PASSWORD, or put
# spring.datasource.password in config/application.properties (gitignored).
spring.datasource.url=${SEATMAP_DB_URL:jdbc:postgresql://localhost:5432/seatmap}
spring.datasource.username=${SEATMAP_DB_USER:seatmap}
spring.datasource.password=${SEATMAP_DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Staff sessions live in Postgres (Spring Session), so logins survive a restart.
spring.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true wherever the app is served over HTTPS.
server.servlet.session.cookie.secure=${SEATMAP_SECURE_COOKIES:false}

# Signs ticket QR codes. Anyone with it can make valid tickets: never commit it.
seatmap.tickets.key=${SEATMAP_TICKET_KEY:}
# file: emails are written to build/mail as .eml files. smtp: sent via spring.mail.host etc.
seatmap.tickets.mail.delivery=${SEATMAP_MAIL_DELIVERY:file}

# The designer's AI assistant (Claude). Off unless switched on: every call costs money.
# The API key is read from the ANTHROPIC_API_KEY environment variable, never from a file.
seatmap.ai.enabled=${SEATMAP_AI_ENABLED:false}
seatmap.ai.model=${SEATMAP_AI_MODEL:claude-opus-5-5}
seatmap.ai.effort=${SEATMAP_AI_EFFORT:high}
# What one organization may spend on the assistant per month, in US dollars (users see a percentage).
seatmap.ai.monthly-allowance=${SEATMAP_AI_MONTHLY_ALLOWANCE:5.00}
# DEBUG also logs every assistant answer in full (they can be large): for looking into a bad one.
logging.level.com.seatmap.api.ai=${SEATMAP_AI_LOG_LEVEL:INFO}
# Photos and PDFs attached to assistant conversations (limits: seatmap.ai.attachments.*).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
