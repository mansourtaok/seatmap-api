spring.application.name=seatmap-api

# Database. The password is not committed: set SEATMAP_DB_PASSWORD, or put
# spring.datasource.password in config/application.properties (gitignored).
spring.datasource.url=${SEATMAP_DB_URL:jdbc:postgresql://localhost:5432/seatmap}
spring.datasource.username=${SEATMAP_DB_USER:seatmap}
spring.datasource.password=${SEATMAP_DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
